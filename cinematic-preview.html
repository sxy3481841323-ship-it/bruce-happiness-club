<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#34423a" />
    <title>布鲁斯 · 陪你一小会儿</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #34423a;
        color: #f4e9d0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 2px solid #f5d99d;
        outline-offset: 4px;
      }
      button,
      summary {
        touch-action: manipulation;
      }
      .preview-dock {
        position: fixed;
        z-index: 1001;
        bottom: max(17px, env(safe-area-inset-bottom));
        left: max(30px, env(safe-area-inset-left));
        right: max(30px, env(safe-area-inset-right));
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        pointer-events: none;
      }
      .preview-dock > * {
        pointer-events: auto;
      }
      .control,
      summary {
        border: 1px solid #ffffff26;
        border-radius: 100px;
        background: #253a2d66;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        font-size: 13px;
        min-height: 42px;
        padding: 10px 16px;
        line-height: 1.4;
        list-style: none;
        white-space: nowrap;
      }
      .control:hover,
      summary:hover {
        background: #1d3228bb;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .modes {
        display: flex;
        gap: 8px;
      }
      details {
        position: relative;
      }
      .menu {
        position: absolute;
        bottom: 55px;
        left: 0;
        width: 310px;
        max-height: min(76dvh, 700px);
        overflow: auto;
        padding: 22px;
        border: 1px solid #ffffff22;
        background: #20372eeb;
        box-shadow: 0 15px 55px #101e2340;
        border-radius: 26px;
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
      }
      .menu p {
        font-size: 13px;
        line-height: 1.75;
        margin: 0 0 16px;
        opacity: 0.7;
      }
      .scene-list {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .scene-list button {
        border: 0;
        text-align: left;
        background: transparent;
        padding: 10px 12px;
        min-height: 42px;
        border-radius: 15px;
        font-size: 14px;
      }
      .scene-list button:hover,
      .scene-list button[aria-current='true'] {
        background: #e8ddbd18;
        color: #ffe0a3;
      }
      .menu label {
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
      }
      .menu select {
        font-size: 13px;
        background: #304a3b;
        border: 1px solid #ffffff33;
        border-radius: 12px;
        padding: 8px;
      }
      .menu .tools {
        display: flex;
        gap: 7px;
        margin-top: 15px;
        flex-wrap: wrap;
      }
      .menu .tools button {
        font-size: 12px;
        padding: 8px 12px;
        border: 1px solid #ffffff33;
        border-radius: 100px;
        background: transparent;
        min-height: 38px;
      }
      .menu .tools button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .empty {
        height: 100%;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 30px;
      }
      .empty h1 {
        font-size: 36px;
        font-weight: 400;
        letter-spacing: 0.1em;
      }
      .empty p {
        font-size: 16px;
        line-height: 1.8;
        opacity: 0.7;
        max-width: 500px;
      }
      .empty button {
        justify-self: center;
        margin-top: 15px;
      }
      .demo-badge {
        font-size: 12px;
        color: #eedebc;
        opacity: 0.65;
        letter-spacing: 0.06em;
      }
      #tour[aria-pressed='true'] {
        background: #ecd7a333;
        color: #ffdf9c;
      }
      @media (max-width: 600px) {
        .preview-dock {
          bottom: max(12px, env(safe-area-inset-bottom));
          left: 18px;
          right: 18px;
          gap: 6px;
        }
        .control,
        summary {
          font-size: 12px;
          padding: 10px 13px;
          min-height: 40px;
        }
        .menu {
          width: min(310px, calc(100vw - 36px));
          max-height: 70dvh;
        }
        .modes {
          gap: 6px;
        }
        .demo-badge {
          display: none;
        }
        #tour {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="cinematic-stage"></main>
    <div id="empty" class="empty" hidden>
      <h1>陪你一小会儿</h1>
      <p>布鲁斯在窗边等你。<br />这是一场本地试映，不会写入真实幸福指数或排行榜。</p>
      <button class="control" id="return">继续放映</button>
    </div>
    <nav class="preview-dock" aria-label="试映控制">
      <details id="catalog">
        <summary>放映目录</summary>
        <div class="menu">
          <p>布鲁斯 · 十段相处的时间<br />本地独立试映，不连接真实排行榜。</p>
          <div class="scene-list" id="scene-list"></div>
          <label
            >入场幸福指数<select id="happiness">
              <option value="100">100 · 平常一天</option>
              <option value="85">85 · 留意冷战</option>
              <option value="70">70 · 冷战试映</option>
            </select></label
          >
          <div class="tools">
            <button id="replay" type="button">重新放映</button
            ><button id="luck" type="button">换分试映</button>
          </div>
          <p id="receipt" style="margin: 16px 0 0">环境音默认关闭；点击画面右上角 ♪ 开启。</p>
        </div>
      </details>
      <span class="demo-badge">本地试映 · 无真实记分</span>
      <div class="modes">
        <button class="control" id="tour" type="button" aria-pressed="false">十幕连映</button
        ><button class="control" id="mode" type="button" aria-pressed="false">亲自互动</button
        ><button class="control" id="next" type="button">下一幕</button>
      </div>
    </nav>
    <script type="module" src="./js/cinematic/preview.js"></script>
  </body>
</html>
